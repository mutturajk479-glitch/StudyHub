<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyHub | Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
            background:
                radial-gradient(circle at 15% 20%, #6366f155, transparent 30%),
                linear-gradient(135deg, #111b3b, #312e81, #4f46e5);
        }

        .login-container {
            width: 100%;
            max-width: 950px;
            min-height: 560px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: white;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 70px #00000035;
            animation: appear 0.8s ease;
        }

        .welcome-panel {
            background: linear-gradient(145deg, #172554, #4338ca);
            color: white;
            padding: 55px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .logo {
            font-size: 30px;
            font-weight: 800;
            margin-bottom: 65px;
        }

        .logo span {
            color: #a5b4fc;
        }

        .welcome-panel h1 {
            font-size: 38px;
            line-height: 1.25;
            margin-bottom: 20px;
        }

        .welcome-panel p {
            color: #dbeafe;
            line-height: 1.9;
            font-size: 14px;
        }

        .welcome-icon {
            font-size: 65px;
            margin-top: 40px;
        }

        .login-panel {
            padding: 55px 45px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-panel h2 {
            font-size: 29px;
            color: #172554;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 32px;
        }

        label {
            display: block;
            color: #334155;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 9px;
        }

        .input-group {
            margin-bottom: 21px;
        }

        .input-group input {
            width: 100%;
            padding: 15px;
            border: 1px solid #dbe2f0;
            border-radius: 10px;
            outline: none;
            font-size: 13px;
            transition: 0.3s;
            background: #f8faff;
        }

        .input-group input:focus {
            border-color: #4f46e5;
            background: white;
            box-shadow: 0 0 0 4px #4f46e515;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 65px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #4f46e5;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(100deg, #4f46e5, #3730a3);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 8px;
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px #4f46e540;
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: wait;
            transform: none;
        }

        #message {
            text-align: center;
            font-size: 13px;
            margin-top: 17px;
            min-height: 20px;
            line-height: 1.5;
        }

        .register-link {
            text-align: center;
            color: #64748b;
            font-size: 13px;
            margin-top: 27px;
        }

        .register-link a {
            color: #4f46e5;
            font-weight: 700;
            text-decoration: none;
        }

        .home-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #64748b;
            text-decoration: none;
            font-size: 12px;
        }

        .home-link:hover,
        .register-link a:hover {
            color: #312e81;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 700px) {
            .login-container {
                grid-template-columns: 1fr;
                max-width: 430px;
            }

            .welcome-panel {
                padding: 30px;
                min-height: 230px;
            }

            .logo {
                margin-bottom: 25px;
                font-size: 25px;
            }

            .welcome-panel h1 {
                font-size: 26px;
            }

            .welcome-panel p {
                font-size: 12px;
            }

            .welcome-icon {
                display: none;
            }

            .login-panel {
                padding: 35px 28px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="welcome-panel">

            <div class="logo">Study<span>Hub.</span></div>

            <h1>Welcome Back!</h1>

            <p>
                Your learning journey continues here.
                Login to explore courses, practice quizzes
                and track your progress.
            </p>

            <div class="welcome-icon">🎓</div>

        </div>

        <div class="login-panel">

            <h2>Login to StudyHub</h2>

            <p class="subtitle">
                Enter your account details to continue.
            </p>

            <form id="loginForm">

                <div class="input-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="input-group">

                    <label for="password">Password</label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            id="togglePassword"
                        >
                            Show
                        </button>

                    </div>
                </div>

                <button type="submit" class="login-btn" id="loginButton">
                    Login to Account →
                </button>

            </form>

            <p id="message" role="status" aria-live="polite"></p>

            <div class="register-link">
                Don't have an account?
                <a href="register.html">Create Account</a>
            </div>

            <a href="index.html" class="home-link">
                ← Back to Homepage
            </a>

        </div>

    </div>

    <script>

        const loginForm = document.getElementById("loginForm");
        const message = document.getElementById("message");
        const loginButton = document.getElementById("loginButton");

        // Show or hide password

        document.getElementById("togglePassword")
            .addEventListener("click", function() {

                const passwordInput =
                    document.getElementById("password");

                if (passwordInput.type === "password") {
                    passwordInput.type = "text";
                    this.textContent = "Hide";
                } else {
                    passwordInput.type = "password";
                    this.textContent = "Show";
                }

            });

        // Login API

        loginForm.addEventListener("submit", async function(event) {

            event.preventDefault();

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;

            message.textContent = "Please wait...";
            message.style.color = "#4f46e5";

            loginButton.disabled = true;
            loginButton.textContent = "Logging in...";

            try {

                const response = await fetch("/api/login", {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();

                if (!response.ok) {

                    message.textContent =
                        data.message || "Login failed.";

                    message.style.color = "red";

                    return;
                }

                localStorage.setItem(
                    "studyhubToken",
                    data.token
                );

                localStorage.setItem(
                    "studyhubUser",
                    JSON.stringify(data.user)
                );

                message.style.color = "green";
                message.textContent = "Login successful!";

                if (data.user.role === "admin") {

                    window.location.href = "admin.html";

                } else {

                    window.location.href = "student.html";

                }

            } catch (error) {

                message.textContent =
                    "Unable to connect to server.";

                message.style.color = "red";

            } finally {

                loginButton.disabled = false;
                loginButton.textContent = "Login to Account →";

            }

        });

    </script>

</body>
</html>
