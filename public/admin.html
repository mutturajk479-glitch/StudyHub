<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyHub Admin Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        header {
            background: #172554;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 850px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #00000015;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            background: #2563eb;
            color: white;
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        #message {
            margin-top: 15px;
        }
    </style>
</head>

<body>

<header>
    <h1>StudyHub Admin Dashboard</h1>
    <p>Manage your courses</p>
</header>

<div class="container">

    <div class="card">
        <h2>Admin Profile</h2>
        <p id="adminMessage">Checking admin access...</p>
    </div>

    <div class="card">
        <h2>Add New Course</h2>

        <form id="courseForm">
            <label>Course Name</label>
            <input type="text" id="courseName" required>

            <label>Course Duration</label>
            <input type="text" id="courseDuration"
                   placeholder="Example: 3 Months" required>

            <button type="submit">Add Course</button>
        </form>

        <p id="message"></p>
    </div>

    <div class="card">
        <h2>Available Courses</h2>
        <div id="courses">Loading courses...</div>
    </div>

    <div class="card">
        <button onclick="logout()">Logout</button>
    </div>

</div>

<script>
    const token = localStorage.getItem("studyhubToken");

    if (!token) {
        window.location.href = "login.html";
    }

    async function checkAdmin() {
        try {
            const response = await fetch("/api/admin/dashboard", {
                headers: {
                    "Authorization": "Bearer " + token
                }
            });

            const data = await response.json();

            if (!response.ok) {
                document.getElementById("adminMessage").textContent =
                    data.message || "Admin access denied.";
                return;
            }

            document.getElementById("adminMessage").textContent =
                data.message;

        } catch (error) {
            document.getElementById("adminMessage").textContent =
                "Unable to connect to server.";
        }
    }

    async function loadCourses() {
        try {
            const response = await fetch("/api/courses");
            const courses = await response.json();

            document.getElementById("courses").innerHTML =
    courses.map(course => `
        <div style="padding:15px; border-bottom:1px solid #ddd;">

            <strong>${course.name}</strong>
            <p>${course.duration}</p>

            <button onclick="editCourse(${course.id}, '${encodeURIComponent(course.name)}', '${encodeURIComponent(course.duration)}')">
                Edit
            </button>

            <button onclick="deleteCourse(${course.id})"
                style="background:red;">
                Delete
            </button>

        </div>
    `).join("");

        } catch (error) {
            document.getElementById("courses").textContent =
                "Unable to load courses.";
        }
    }

    document.getElementById("courseForm").addEventListener(
        "submit",
        async function(event) {
            event.preventDefault();

            const name = document.getElementById("courseName").value;
            const duration = document.getElementById("courseDuration").value;
            const message = document.getElementById("message");

            try {
                const response = await fetch("/api/courses", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token
                    },
                    body: JSON.stringify({
                        name: name,
                        duration: duration
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    message.style.color = "red";
                    message.textContent = data.message || "Unable to add course.";
                    return;
                }

                message.style.color = "green";
                message.textContent = "Course added successfully!";

                document.getElementById("courseForm").reset();
                loadCourses();

            } catch (error) {
                message.style.color = "red";
                message.textContent = "Unable to connect to server.";
            }
        }
    );

    async function deleteCourse(courseId) {

    const confirmDelete = confirm("Are you sure you want to delete this course?");

    if (!confirmDelete) {
        return;
    }

    try {
        const response = await fetch("/api/courses/" + courseId, {
            method: "DELETE",
            headers: {
                "Authorization": "Bearer " + token
            }
        });

        const data = await response.json();

        if (!response.ok) {
            alert(data.message);
            return;
        }

        alert("Course deleted successfully!");

        loadCourses();

    } catch (error) {
        alert("Unable to connect to server.");
    }
}

    async function editCourse(courseId, encodedName, encodedDuration) {

    const oldName = decodeURIComponent(encodedName);
    const oldDuration = decodeURIComponent(encodedDuration);

    const newName = prompt("Enter new course name:", oldName);

    if (newName === null || !newName.trim()) {
        return;
    }

    const newDuration = prompt("Enter new course duration:", oldDuration);

    if (newDuration === null || !newDuration.trim()) {
        return;
    }

    try {
        const response = await fetch("/api/courses/" + courseId, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token
            },
            body: JSON.stringify({
                name: newName.trim(),
                duration: newDuration.trim()
            })
        });

        const data = await response.json();

        if (!response.ok) {
            alert(data.message);
            return;
        }

        alert("Course updated successfully!");

        loadCourses();

    } catch (error) {
        alert("Unable to connect to server.");
    }
}

    function logout() {
        localStorage.removeItem("studyhubToken");
        localStorage.removeItem("studyhubUser");
        window.location.href = "login.html";
    }

    checkAdmin();
    loadCourses();
</script>

</body>
</html>
