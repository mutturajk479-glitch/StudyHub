<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyHub | Create Account</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
            background:
                radial-gradient(circle at 15% 20%, #6366f155, transparent 30%),
                linear-gradient(135deg, #111b3b, #312e81, #4f46e5);
        }

        .register-container {
            width: 100%;
            max-width: 950px;
            min-height: 580px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: white;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 70px #00000035;
            animation: appear 0.8s ease;
        }

        .welcome-panel {
            background: linear-gradient(145deg, #172554, #4338ca);
            color: white;
            padding: 55px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .logo {
            font-size: 30px;
            font-weight: 800;
            margin-bottom: 65px;
        }

        .logo span {
            color: #a5b4fc;
        }

        .welcome-panel h1 {
            font-size: 36px;
            line-height: 1.3;
            margin-bottom: 20px;
        }

        .welcome-panel p {
            color: #dbeafe;
            line-height: 1.9;
            font-size: 14px;
        }

        .welcome-icon {
            font-size: 65px;
            margin-top: 40px;
        }

        .register-panel {
            padding: 45px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .register-panel h2 {
            font-size: 28px;
            color: #172554;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 27px;
        }

        label {
            display: block;
            color: #334155;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 9px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group input {
            width: 100%;
            padding: 15px;
            border: 1px solid #dbe2f0;
            border-radius: 10px;
            outline: none;
            font-size: 13px;
            background: #f8faff;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #4f46e5;
            background: white;
            box-shadow: 0 0 0 4px #4f46e515;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 65px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #4f46e5;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .register-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(100deg, #4f46e5, #3730a3);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 8px;
        }

        .register-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px #4f46e540;
        }

        .register-btn:disabled {
            opacity: 0.7;
            cursor: wait;
            transform: none;
        }

        #message {
            text-align: center;
            font-size: 13px;
            margin-top: 16px;
            min-height: 20px;
            line-height: 1.5;
        }

        .login-link {
            text-align: center;
            color: #64748b;
            font-size: 13px;
            margin-top: 22px;
        }

        .login-link a {
            color: #4f46e5;
            font-weight: 700;
            text-decoration: none;
        }

        .home-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #64748b;
            text-decoration: none;
            font-size: 12px;
        }

        .login-link a:hover,
        .home-link:hover {
            color: #312e81;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 700px) {
            .register-container {
                grid-template-columns: 1fr;
                max-width: 430px;
            }

            .welcome-panel {
                padding: 30px;
                min-height: 220px;
            }

            .logo {
                margin-bottom: 25px;
                font-size: 25px;
            }

            .welcome-panel h1 {
                font-size: 26px;
            }

            .welcome-panel p {
                font-size: 12px;
            }

            .welcome-icon {
                display: none;
            }

            .register-panel {
                padding: 35px 28px;
            }
        }
    </style>
</head>

<body>

    <div class="register-container">

        <div class="welcome-panel">

            <div class="logo">Study<span>Hub.</span></div>

            <h1>Start Your Learning Journey!</h1>

            <p>
                Create your StudyHub account and discover
                courses, practice quizzes and track your
                learning progress in one place.
            </p>

            <div class="welcome-icon">🎓</div>

        </div>

        <div class="register-panel">

            <h2>Create Account</h2>

            <p class="subtitle">
                Join StudyHub and start learning today.
            </p>

            <form id="registerForm">

                <div class="input-group">
                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="input-group">

                    <label for="password">
                        Password (minimum 8 characters)
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            placeholder="Create a password"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            id="togglePassword"
                        >
                            Show
                        </button>

                    </div>
                </div>

                <button
                    type="submit"
                    class="register-btn"
                    id="registerButton"
                >
                    Create My Account →
                </button>

            </form>

            <p id="message" role="status" aria-live="polite"></p>

            <div class="login-link">
                Already have an account?
                <a href="login.html">Login</a>
            </div>

            <a href="index.html" class="home-link">
                ← Back to Homepage
            </a>

        </div>

    </div>

    <script>

        const registerForm =
            document.getElementById("registerForm");

        const message =
            document.getElementById("message");

        const registerButton =
            document.getElementById("registerButton");

        // Show or hide password

        document.getElementById("togglePassword")
            .addEventListener("click", function() {

                const passwordInput =
                    document.getElementById("password");

                if (passwordInput.type === "password") {
                    passwordInput.type = "text";
                    this.textContent = "Hide";
                } else {
                    passwordInput.type = "password";
                    this.textContent = "Show";
                }

            });

        // Registration API

        registerForm.addEventListener("submit", async function(event) {

            event.preventDefault();

            const name =
                document.getElementById("name").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;

            message.textContent = "Please wait...";
            message.style.color = "#4f46e5";

            registerButton.disabled = true;
            registerButton.textContent = "Creating Account...";

            try {

                const response = await fetch("/api/register", {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        name: name,
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();

                if (!response.ok) {

                    message.style.color = "red";

                    message.textContent =
                        data.message || "Registration failed.";

                    return;
                }

                message.style.color = "green";

                message.textContent =
                    "Registration successful! Please login.";

                registerForm.reset();

            } catch (error) {

                message.style.color = "red";

                message.textContent =
                    "Unable to connect to server. Please try again.";

            } finally {

                registerButton.disabled = false;

                registerButton.textContent =
                    "Create My Account →";

            }

        });

    </script>

</body>
</html>
